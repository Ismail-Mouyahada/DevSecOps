name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build and Push devsecops-api Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/devsecops-api:latest -f api.Dockerfile .
        docker push ghcr.io/${{ github.repository_owner }}/devsecops-api:latest

    - name: Build and Push devsecops-console Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/devsecops-console:latest -f console.Dockerfile .
        docker push ghcr.io/${{ github.repository_owner }}/devsecops-console:latest
