name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - develop  # Trigger workflow on pushes to the develop branch
  workflow_dispatch:  # Allows manual trigger of the workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      packages: write  # Permission to write to GHCR
      contents: read   # Permission to read the repository contents

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build and Push devsecops-api Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/devsecops-api:latest -f api.Dockerfile .
        docker push ghcr.io/${{ github.repository_owner }}/devsecops-api:latest

    - name: Build and Push devsecops-console Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/devsecops-console:latest -f console.Dockerfile .
        docker push ghcr.io/${{ github.repository_owner }}/devsecops-console:latest

    - name: Tag and Push RabbitMQ (optional)
      if: false # Set to true if you want to tag RabbitMQ
      run: |
        docker tag rabbitmq:3-management ghcr.io/${{ github.repository_owner }}/rabbitmq:3-management
        docker push ghcr.io/${{ github.repository_owner }}/rabbitmq:3-management

    - name: Tag and Push MSSQL Server (optional)
      if: false # Set to true if you want to tag MSSQL
      run: |
        docker tag mcr.microsoft.com/mssql/server:2022-latest ghcr.io/${{ github.repository_owner }}/mssql-server:2022-latest
        docker push ghcr.io/${{ github.repository_owner }}/mssql-server:2022-latest
